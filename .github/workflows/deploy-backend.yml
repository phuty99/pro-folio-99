name: Build and push backend image

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: profile-backend
  LOKI_HOST: logs-prod-020.grafana.net
  LOKI_USER: "1795826"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

            # Ship container logs to Grafana Cloud Loki. Skipped when the token or plugin is missing,
            # so a logging problem can never stop the backend from deploying.
            docker plugin ls --format '{{.Name}}' | grep -q '^loki:' || docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions || true
            LOKI_TOKEN='${{ secrets.GRAFANA_LOKI_TOKEN }}'
            LOG_OPTS=""
            if [ -n "$LOKI_TOKEN" ] && docker plugin ls --format '{{.Name}}' | grep -q '^loki:'; then
              LOG_OPTS="--log-driver=loki --log-opt loki-url=https://${{ env.LOKI_USER }}:${LOKI_TOKEN}@${{ env.LOKI_HOST }}/loki/api/v1/push --log-opt mode=non-blocking --log-opt max-buffer-size=4m --log-opt loki-external-labels=app=profile-backend,env=production"
            fi

            docker stop profile-backend || true
            docker rm profile-backend || true
            docker run -d \
              --name profile-backend \
              --restart unless-stopped \
              --env-file /home/ec2-user/backend.env \
              -p 127.0.0.1:8000:8000 \
              $LOG_OPTS \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            docker image prune -f
